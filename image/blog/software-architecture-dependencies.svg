<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Input and output ports in Clean Architecture</title><desc id="desc">The UI adapter calls an input port; an API adapter implements a different application-owned output port. Policy does not import adapters.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70909b" stroke-width="2.4" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="998" height="518" rx="20" fill="#fcfbf9" stroke="#e2e7e5" stroke-width="2"/><text x="40" y="57" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">SOURCE-CODE DEPENDENCIES</text><text x="40" y="89" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#3d5766">Different input and output ports are owned by application policy.</text><rect x="48" y="147" width="253" height="101" rx="18" fill="#e0edf0" stroke="#70909b" stroke-width="2"/><text x="174.5" y="191.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">UI adapter</text><text x="174.5" y="222.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">Presentation</text><rect x="699" y="147" width="253" height="101" rx="18" fill="#f6eadb" stroke="#70909b" stroke-width="2"/><text x="825.5" y="191.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">API adapter</text><text x="825.5" y="222.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">Infrastructure</text><rect x="240" y="291" width="520" height="189" rx="20" fill="#e0efe8" stroke="#9fbfb1" stroke-width="2"/><text x="500" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">APPLICATION-OWNED CONTRACTS</text><rect x="264" y="350" width="213" height="87" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="370.5" y="387.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Input port</text><text x="370.5" y="418.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">UI calls it</text><rect x="523" y="350" width="213" height="87" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="629.5" y="387.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Output port</text><text x="629.5" y="418.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">API implements</text><path d="M191 257 L362 340" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M809 257 L632 340" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/></svg>