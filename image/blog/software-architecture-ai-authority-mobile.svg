<svg xmlns="http://www.w3.org/2000/svg" width="420" height="846" viewBox="0 0 420 846" role="img" aria-labelledby="title desc"><title id="title">Model advisory output and execution authority</title><desc id="desc">The model proposes an action; schema validation, policy approval, and execution are independent trusted steps.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70909b" stroke-width="2.4" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="418" height="844" rx="20" fill="#fcfbf9" stroke="#e2e7e5" stroke-width="2"/><text x="24" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">MODEL ADVICE ≠ AUTHORITY</text><rect x="60" y="86" width="300" height="92" rx="18" fill="#e9e6f4" stroke="#70909b" stroke-width="2"/><text x="210.0" y="126.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Model</text><text x="210.0" y="157.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">Untrusted proposal</text><path d="M210 184 L210 227" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M24 241H396" fill="none" stroke="#a85850" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/><text x="210" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#a85850">TRUST BOUNDARY</text><path d="M210 285 L210 330" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="60" y="340" width="300" height="88" rx="18" fill="#e0efe8" stroke="#70909b" stroke-width="2"/><text x="210.0" y="378.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Validate</text><text x="210.0" y="409.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">Schema + scope</text><path d="M210 436 L210 481" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="60" y="489" width="300" height="88" rx="18" fill="#f6eadb" stroke="#70909b" stroke-width="2"/><text x="210.0" y="527.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Authorize</text><text x="210.0" y="558.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">Policy + approval</text><path d="M210 583 L210 628" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="60" y="635" width="300" height="88" rx="18" fill="#e0edf0" stroke="#70909b" stroke-width="2"/><text x="210.0" y="673.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Execute</text><text x="210.0" y="704.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">Constrained action</text><text x="210" y="788" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#a85850">Denied → no execution</text><text x="210" y="816" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#3d5766">Executed → evidence recorded</text></svg>