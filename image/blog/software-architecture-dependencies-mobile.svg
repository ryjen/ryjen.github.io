<svg xmlns="http://www.w3.org/2000/svg" width="420" height="780" viewBox="0 0 420 780" role="img" aria-labelledby="title desc"><title id="title">Input and output ports in Clean Architecture</title><desc id="desc">The UI adapter calls an input port; an API adapter implements a different application-owned output port. Policy does not import adapters.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70909b" stroke-width="2.4" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="418" height="778" rx="20" fill="#fcfbf9" stroke="#e2e7e5" stroke-width="2"/><text x="22" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">SOURCE-CODE DEPENDENCIES</text><rect x="22" y="99" width="177" height="92" rx="18" fill="#e0edf0" stroke="#70909b" stroke-width="2"/><text x="110.5" y="153.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">UI adapter</text><rect x="221" y="99" width="177" height="92" rx="18" fill="#f6eadb" stroke="#70909b" stroke-width="2"/><text x="309.5" y="153.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">API adapter</text><rect x="15" y="270" width="390" height="240" rx="18" fill="#e0efe8" stroke="#9fbfb1" stroke-width="2"/><text x="210" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">APPLICATION CONTRACTS</text><rect x="28" y="342" width="174" height="92" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="115.0" y="382.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">Input port</text><text x="115.0" y="413.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">UI calls it</text><rect x="218" y="342" width="174" height="92" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="305.0" y="382.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Output port</text><text x="305.0" y="413.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">API implements</text><path d="M104 197 L114 333" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M308 197 L305 333" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="210" y="497" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#3d5766">Use case owns both ports.</text><path d="M22 541H398" fill="none" stroke="#d5dfdf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="578" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">RUNTIME CALLS</text><rect x="24" y="601" width="103" height="74" rx="18" fill="#e0edf0" stroke="#70909b" stroke-width="2"/><text x="75.5" y="646.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">UI</text><rect x="154" y="601" width="112" height="74" rx="18" fill="#e0efe8" stroke="#70909b" stroke-width="2"/><text x="210.0" y="646.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">Use case</text><rect x="293" y="601" width="103" height="74" rx="18" fill="#f6eadb" stroke="#70909b" stroke-width="2"/><text x="344.5" y="646.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">API</text><text x="140" y="647" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#70909b">→</text><text x="280" y="647" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#70909b">→</text><text x="210" y="740" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#3d5766">Calls can cross outward through ports.</text></svg>