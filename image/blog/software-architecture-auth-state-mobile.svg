<svg xmlns="http://www.w3.org/2000/svg" width="420" height="715" viewBox="0 0 420 715" role="img" aria-labelledby="title desc"><title id="title">Guarding asynchronous authentication results</title><desc id="desc">A stale request cannot update the active session; a current request may update state after verification.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70909b" stroke-width="2.4" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="418" height="713" rx="20" fill="#fcfbf9" stroke="#e2e7e5" stroke-width="2"/><text x="24" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">ASYNC AUTHENTICATION</text><text x="24" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#3d5766">Only current requests update state.</text><rect x="24" y="120" width="372" height="205" rx="18" fill="#f9eeee" stroke="#e0c3c2" stroke-width="2"/><text x="45" y="159" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#203949">Request A</text><text x="45" y="196" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#203949">Starts first; finishes late</text><path d="M45 235H290" fill="none" stroke="#a85850" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 224L301 246M301 224L280 246" fill="none" stroke="#a85850" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#a85850">Discard stale result</text><rect x="24" y="343" width="372" height="205" rx="18" fill="#e0efe8" stroke="#9fbfb1" stroke-width="2"/><text x="45" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#203949">Request B</text><text x="45" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#203949">Current session; finishes</text><path d="M45 462 L288 462" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="45" y="513" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#316d59">Accept result</text><path d="M210 555 L210 583" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="55" y="596" width="310" height="84" rx="18" fill="#e0edf0" stroke="#70909b" stroke-width="2"/><text x="210.0" y="632.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">State owner</text><text x="210.0" y="663.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">Controlled update</text></svg>