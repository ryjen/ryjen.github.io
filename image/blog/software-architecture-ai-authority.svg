<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="493" viewBox="0 0 1000 493" role="img" aria-labelledby="title desc"><title id="title">Model advisory output and execution authority</title><desc id="desc">The model proposes an action; schema validation, policy approval, and execution are independent trusted steps.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70909b" stroke-width="2.4" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="998" height="491" rx="20" fill="#fcfbf9" stroke="#e2e7e5" stroke-width="2"/><text x="34" y="57" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">THE MODEL DOES NOT OWN EXECUTION AUTHORITY</text><text x="34" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#3d5766">Proposal crosses a trust boundary before any effects occur.</text><rect x="35" y="160" width="204" height="113" rx="18" fill="#e9e6f4" stroke="#70909b" stroke-width="2"/><text x="137.0" y="210.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Model</text><text x="137.0" y="241.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">Propose</text><path d="M266 118V333" fill="none" stroke="#a85850" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 9"/><text x="280" y="139" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#a85850">TRUST BOUNDARY</text><rect x="311" y="160" width="192" height="113" rx="18" fill="#e0efe8" stroke="#70909b" stroke-width="2"/><text x="407.0" y="210.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">Validate</text><text x="407.0" y="241.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">Schema + scope</text><rect x="543" y="160" width="192" height="113" rx="18" fill="#f6eadb" stroke="#70909b" stroke-width="2"/><text x="639.0" y="210.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">Authorize</text><text x="639.0" y="241.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">Policy + approval</text><rect x="774" y="160" width="192" height="113" rx="18" fill="#e0edf0" stroke="#70909b" stroke-width="2"/><text x="870.0" y="210.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203949">Execute</text><text x="870.0" y="241.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#203949">Constrained action</text><path d="M242 216 L294 216" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M507 216 L526 216" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M739 216 L757 216" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M408 280V342H505" fill="none" stroke="#a85850" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M640 278V333" fill="none" stroke="#a85850" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="510" y="338" width="226" height="65" rx="18" fill="#f7e8e6" stroke="#d8b9b4" stroke-width="2"/><text x="623" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#a85850">Reject / no effect</text><path d="M871 276V333" fill="none" stroke="#316d59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="782" y="340" width="187" height="63" rx="18" fill="#e0efe8" stroke="#9fbfb1" stroke-width="2"/><text x="875" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203949">Audit evidence</text><text x="495" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#3d5766">Validation and authorization belong to trusted policy, not to the model.</text></svg>