<svg xmlns="http://www.w3.org/2000/svg" width="420" height="925" viewBox="0 0 420 925" role="img" aria-labelledby="title desc"><title id="title">Comparing packaging strategies</title><desc id="desc">Feature work spans layers in a layer-first organization; feature-first packages own layers within each capability.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70909b" stroke-width="2.4" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="418" height="923" rx="20" fill="#fcfbf9" stroke="#e2e7e5" stroke-width="2"/><text x="24" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">LAYER-FIRST</text><text x="24" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#3d5766">Technical layers mix features.</text><rect x="29" y="117" width="362" height="71" rx="18" fill="#e0edf0" stroke="#93b7c0" stroke-width="2"/><text x="45" y="160" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">Presentation</text><circle cx="300" cy="152" r="9" fill="#b7afd2"/><circle cx="327" cy="152" r="9" fill="#9fbfb1"/><circle cx="354" cy="152" r="9" fill="#d5bda0"/><rect x="29" y="200" width="362" height="71" rx="18" fill="#e0edf0" stroke="#93b7c0" stroke-width="2"/><text x="45" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">Application</text><circle cx="300" cy="235" r="9" fill="#b7afd2"/><circle cx="327" cy="235" r="9" fill="#9fbfb1"/><circle cx="354" cy="235" r="9" fill="#d5bda0"/><rect x="29" y="283" width="362" height="71" rx="18" fill="#e0edf0" stroke="#93b7c0" stroke-width="2"/><text x="45" y="326" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">Domain</text><circle cx="300" cy="318" r="9" fill="#b7afd2"/><circle cx="327" cy="318" r="9" fill="#9fbfb1"/><circle cx="354" cy="318" r="9" fill="#d5bda0"/><rect x="29" y="366" width="362" height="71" rx="18" fill="#e0edf0" stroke="#93b7c0" stroke-width="2"/><text x="45" y="409" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">Infrastructure</text><circle cx="300" cy="401" r="9" fill="#b7afd2"/><circle cx="327" cy="401" r="9" fill="#9fbfb1"/><circle cx="354" cy="401" r="9" fill="#d5bda0"/><path d="M24 478H396" fill="none" stroke="#d5dfdf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="531" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">FEATURE-FIRST</text><text x="24" y="566" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#3d5766">Each feature owns its layers.</text><rect x="29" y="588" width="362" height="146" rx="18" fill="#e9e6f4" stroke="#70909b" stroke-width="2"/><text x="46" y="625" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">Authentication</text><rect x="48" y="640" width="148" height="38" rx="8" fill="#ffffff" stroke="#cad7d6" stroke-width="2"/><text x="122" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">UI</text><rect x="222" y="640" width="148" height="38" rx="8" fill="#ffffff" stroke="#cad7d6" stroke-width="2"/><text x="296" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">Use case</text><rect x="48" y="684" width="148" height="38" rx="8" fill="#ffffff" stroke="#cad7d6" stroke-width="2"/><text x="122" y="710" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#203949">Domain</text><rect x="2