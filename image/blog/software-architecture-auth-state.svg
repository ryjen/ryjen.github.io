<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img" aria-labelledby="title desc"><title id="title">Guarding asynchronous authentication results</title><desc id="desc">A stale request cannot update the active session; a current request may update state after verification.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#70909b" stroke-width="2.4" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="998" height="513" rx="20" fill="#fcfbf9" stroke="#e2e7e5" stroke-width="2"/><text x="35" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203949">ASYNC COMPLETION MUST MATCH CURRENT STATE</text><text x="35" y="91" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#3d5766">Two overlapping login requests:</text><rect x="35" y="133" width="930" height="124" rx="18" fill="#f9eeee" stroke="#e0c3c2" stroke-width="2"/><rect x="60" y="158" width="200" height="74" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="160.0" y="203.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Request A</text><path d="M280 194H747" fill="none" stroke="#a85850" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8"/><path d="M753 179L783 209M783 179L753 209" fill="none" stroke="#a85850" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="852" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#a85850">STALE</text><rect x="35" y="282" width="930" height="122" rx="18" fill="#e0efe8" stroke="#9fbfb1" stroke-width="2"/><rect x="60" y="307" width="200" height="74" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="160.0" y="352.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Request B</text><path d="M280 344 L542 344" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="555" y="307" width="181" height="74" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="645.5" y="352.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203949">Check ID</text><path d="M740 344 L764 344" fill="none" stroke="#70909b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="780" y="307" width="166" height="74" rx="18" fill="#ffffff" stroke="#70909b" stroke-width="2"/><text x="863.0" y="352.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#203949">Apply state</text><text x="500" y="463" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#3d5766">A single state owner rejects late results from superseded sessions.</text></svg>